name: Bug report
description: Something in the engine, a sample, a visualization or a lesson does not work.
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The page or file, for example samples/2d/04-platformer or engine/2d/physics.js.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: "1. Open ...\n2. Press ...\n3. See ..."
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 131 on Windows 11 (WSL), Safari on iPhone...
  - type: textarea
    id: console
    attributes:
      label: Console errors (F12, Console tab)
      render: text
