<!doctype html>
<!--
  templates/runner/index.html
  WHAT: Game template: Endless runner. All the code is in main.js; copy this folder to start
        your own game from it.
  RUN:  from the repo root, python3 -m http.server 8000, then open
        http://localhost:8000/templates/runner/
  DOC:  templates/README.md
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endless runner | Kindling template</title>
  <link rel="stylesheet" href="../template.css">
  <script type="importmap">
    { "imports": { "kindling/": "../../engine/" } }
  </script>
</head>
<body>
  <main>
    <p><a href="../../">Kindling</a> · <a href="../">Templates</a> · <strong>Endless runner</strong> · <a href="https://github.com/Normansrule/video-game-kindling/tree/main/templates/runner">source</a></p>
    <canvas id="game" aria-label="Endless runner. An endless runner: your character runs right by itself over cactuses, crates and spikes, under bats, collecting coins."></canvas>
    <p class="keys">Space, click or tap to jump (hold for higher) · R to restart</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
