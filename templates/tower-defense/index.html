<!doctype html>
<!--
  templates/tower-defense/index.html
  WHAT: Game template: Tower defense. All the code is in main.js; copy this folder to start
        your own game from it.
  RUN:  from the repo root, python3 -m http.server 8000, then open
        http://localhost:8000/templates/tower-defense/
  DOC:  templates/README.md
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower defense | Kindling template</title>
  <link rel="stylesheet" href="../template.css">
  <script type="importmap">
    { "imports": { "kindling/": "../../engine/" } }
  </script>
</head>
<body>
  <main>
    <p><a href="../../">Kindling</a> · <a href="../">Templates</a> · <strong>Tower defense</strong> · <a href="https://github.com/Normansrule/video-game-kindling/tree/main/templates/tower-defense">source</a></p>
    <canvas id="game" aria-label="Tower defense. A tower defense game: monsters walk along a path and towers you build shoot them."></canvas>
    <p class="keys">Click or tap grass to build a tower (10 coins) · click a tower to upgrade it · Space starts the next wave</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
